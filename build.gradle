plugins {
    id 'scala'
    id 'java-library'
    id 'maven-publish'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
    id 'net.kyori.blossom' version '2.2.0'
}

version = mod_version
group = root_package

base {
    archivesName = mod_id
}

scala {
    scalaVersion = '3.8.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

configurations {
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader '0.5.17-alpha'
        runs.all {
            args += ['--username', minecraft_username]
            def trimmedJvmArgs = extra_jvm_args?.trim()
            if (trimmedJvmArgs) {
                jvmArgs += trimmedJvmArgs.split(/\s+/).toList()
            }
            if (enable_foundation_debug.toBoolean()) {
                systemProperty 'foundation.dump', 'true'
                systemProperty 'foundation.verbose', 'true'
            }
        }
    }

    defaultRemapJar = false
    remap(tasks.named('jar').get())
    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

repositories {
    maven {
        name = 'Cleanroom'
        url = 'https://maven.cleanroommc.com'
    }
    mavenCentral()
}

dependencies {
    implementation 'org.scala-lang.modules:scala-parser-combinators_3:2.4.0'
    compileOnly 'com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7'
    if (enable_lwjglx.toBoolean()) {
        compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    }
    modRuntimeOnly 'com.cleanroommc:scalar:1.0.0'
}

sourceSets {
    main {
        blossom {
            scalaSources {
                property('mod_version', mod_version)
            }
            resources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('mod_description', mod_description)
                property('mod_authors', mod_authors.split(',').findAll { !it.isBlank() }.collect { "\"${it.strip()}\"" }.join(', '))
                property('mod_credits', mod_credits)
                property('mod_url', mod_url)
                property('mod_update_json', mod_update_json)
                property('mod_logo_path', mod_logo_path)
            }
        }
    }
}

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('ModType': 'CRL')
    }
    finalizedBy(tasks.named('remapJar').get())
}

tasks.named('remapJar').configure {
    archiveClassifier = 'universal'
}

publishing {
    repositories {
        maven {
            name = 'outlands'
            url = 'https://maven.outlands.top/releases'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('remapJar').get()
            groupId = root_package
            artifactId = mod_id
        }
    }
}
